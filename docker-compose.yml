services:
  devdocs-qa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devdocs-qa
    ports:
      - "8000:8000"
    environment:
      RAG_KB_DIR: /app/data/knowledge_base
      RAG_DOC_SOURCES_PATH: /app/data/doc_sources.json
      RAG_EVAL_CASES_PATH: /app/data/evaluation/devdocs_eval_set.json
      RAG_ENABLE_EMBEDDINGS: "0"
      RAG_ENABLE_RERANKER: "0"
      RAG_ENABLE_LLM: "1"
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      AICANAPI_API_KEY: ${AICANAPI_API_KEY:-}
      RAG_EXTRA_LLM_PROVIDERS_JSON: ${RAG_EXTRA_LLM_PROVIDERS_JSON:-[]}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
